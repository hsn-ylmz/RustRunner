name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow and only publishes if it passes.
  workflow_call:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RustRunner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustRunner

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --all --verbose

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RustRunner-Desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RustRunner-Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # webpack builds the renderer with transpileOnly, so type errors only
      # surface if we typecheck both projects explicitly.
      - name: Typecheck main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RustRunner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustRunner

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    name: Desktop e2e (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustRunner

      # Shared libraries the Electron binary links against, plus Xvfb for a
      # virtual display. (24.04 package names carry the t64 suffix.)
      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth procps \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxdamage1 libxrandr2 libxcomposite1 libxfixes3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RustRunner-Desktop/package-lock.json

      - name: Install dependencies
        working-directory: RustRunner-Desktop
        run: npm ci

      # `test:e2e` builds the engine (debug) and the app, then runs Playwright.
      # Fixtures sandbox HOME/TMPDIR, so no conda env is ever created.
      - name: Run e2e tests
        working-directory: RustRunner-Desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: RustRunner-Desktop/e2e/.tmp/results
          if-no-files-found: ignore
          retention-days: 14
