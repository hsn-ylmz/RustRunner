name: Release

# Fires on a version tag, e.g. `git tag v1.0.0-beta.1 && git push origin v1.0.0-beta.1`.
#
# The tag must equal the version in package.json and Cargo.toml (with a leading v).
# A tag with a pre-release part (v1.0.0-beta.1) produces beta-*.yml update files; when
# the draft is published by hand, tick "Set as a pre-release". Builds that are already
# on a beta then follow it (see RustRunner-Desktop/src/main/appVersion.ts), and 0.11.x
# builds, which only look at the latest stable release, are not offered it.
on:
  push:
    tags:
      - 'v*'

# Needed for electron-builder to create/update the GitHub release.
permissions:
  contents: write

jobs:
  # Gate: the whole CI workflow (tests, lint, e2e) must pass for the tagged
  # commit before any platform builds or publishes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep other platforms going if one leg fails, so a partial draft is
      # still inspectable rather than losing everything.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            builder_args: --mac --arm64
          - name: macOS x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            builder_args: --mac --x64
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            builder_args: --win --x64
          - name: Linux x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            builder_args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustRunner
          key: ${{ matrix.rust_target }}

      # musl is a cross-compile even on x86_64 Linux and needs its own linker.
      - name: Install musl toolchain
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # afterPack.js copies the engine from
      # RustRunner/target/<triple>/release/, so the target must be explicit —
      # a plain `cargo build --release` would not satisfy it.
      - name: Build engine
        working-directory: RustRunner
        env:
          # .cargo/config.toml names the musl linker by its full triple, which
          # is how the cross toolchains install it locally. Ubuntu's musl-tools
          # package installs it as plain `musl-gcc`, so override it here.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.rust_target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RustRunner-Desktop/package-lock.json

      - name: Install dependencies
        working-directory: RustRunner-Desktop
        run: npm ci

      - name: Build renderer and main process
        working-directory: RustRunner-Desktop
        run: npm run build

      # The package:* scripts pass `--publish never`, so electron-builder is
      # invoked directly here in order to publish. Artifacts land on a draft
      # release (build.publish[0].releaseType) that you publish by hand once
      # every platform has uploaded.
      - name: Package and publish
        working-directory: RustRunner-Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned; without this electron-builder tries to
          # discover a signing identity and fails on the macOS runners.
          # Quoted: Actions requires env values to be strings, and an unquoted
          # false parses as a YAML boolean.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # bash on every OS (Git Bash on Windows) so `pipefail` applies and
        # electron-builder's exit code isn't masked by `tee`.
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.builder_args }} --publish always 2>&1 \
            | tee "$RUNNER_TEMP/electron-builder.log"

      # electron-builder exits 0 when it decides not to publish (for example
      # when it doesn't consider the build a release), which would leave a
      # green job and an empty release. Fail loudly instead.
      - name: Verify electron-builder published
        if: success()
        shell: bash
        run: |
          if grep -Eiq 'skipped publishing|publishing (is )?skipped' "$RUNNER_TEMP/electron-builder.log"; then
            echo "::error::electron-builder skipped publishing - no release assets were uploaded"
            grep -Ei 'skipped publishing|publishing (is )?skipped' "$RUNNER_TEMP/electron-builder.log"
            exit 1
          fi
          echo "electron-builder did not report skipping publishing"

