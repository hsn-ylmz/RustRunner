<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      http-equiv="Content-Security-Policy"
      content="<%= csp %>"
    />
    <title>RustRunner - Visual Workflow Editor</title>
    <meta name="color-scheme" content="light dark" />

        background: Canvas;
      }

    <div id="root"></div>
  </body>
